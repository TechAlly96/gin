name: Coleta e publicacao GIN

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora (UTC), minuto 17 para fugir do pico da hora cheia
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["app/**", "fontes/**", "coletor/**", ".github/workflows/coletar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta-gin
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar codigo (main)
        uses: actions/checkout@v5

      - name: Recuperar historico (ramo dados)
        run: |
          if git ls-remote --exit-code --heads origin dados > /dev/null; then
            git fetch --depth=1 origin dados
            git worktree add --detach dados FETCH_HEAD
          else
            echo "Ramo dados ainda nao existe: criando historico novo"
            git worktree add --detach dados
            git -C dados checkout --orphan dados
            git -C dados rm -rf --quiet .
          fi
          printf '*.ogg\n' > dados/.gitignore

      - name: Coletar todos os paises
        run: |
          python3 --version
          mkdir -p logs
          ls fontes/*.json | xargs -n1 basename | sed 's/[.]json$//' | xargs -P 10 -I{} sh -c 'python3 coletor/coletar.py {} > logs/coleta-{}.log 2>&1 || echo "::warning::Coleta de {} falhou"'
          for f in logs/coleta-*.log; do echo "::group::$(basename "$f" .log)"; cat "$f"; echo "::endgroup::"; done
          python3 coletor/juntar_paises.py

      - name: Restaurar cache da traducao (ambiente e modelos)
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/argos
            argos-modelos
          key: argos-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: argos-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Traduzir noticias para portugues
        continue-on-error: true
        env:
          ARGOS_MODELOS: ${{ github.workspace }}/argos-modelos
        run: |
          mkdir -p argos-modelos && rm -f argos-modelos/NOVO
          if ! /tmp/argos/bin/python -c "import ctranslate2, sentencepiece, sacremoses, subword_nmt" 2>/dev/null; then
            touch argos-modelos/NOVO
            rm -rf /tmp/argos
            python3 -m venv /tmp/argos
            /tmp/argos/bin/pip install --quiet ctranslate2 sentencepiece sacremoses subword-nmt
          fi
          ls fontes/*.json | xargs -n1 basename | sed 's/[.]json$//' | xargs -P 2 -I{} sh -c '/tmp/argos/bin/python -u coletor/traduzir.py {} || echo "::warning::Traducao de {} falhou"'

      - name: Salvar cache da traducao (so se baixou modelo novo ou reinstalou)
        if: always() && hashFiles('argos-modelos/NOVO') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/argos
            argos-modelos
          key: argos-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Cache do ambiente do Piper
        uses: actions/cache@v4
        with:
          path: /tmp/piper
          key: piper-venv-v1-${{ runner.os }}-${{ runner.arch }}

      - name: Cache das ferramentas de voz (ffmpeg estatico + Piper)
        uses: actions/cache@v4
        with:
          path: |
            /tmp/ffmpeg-estatico
            /tmp/piper
          key: voz-ferramentas-v1

      - name: Preparar voz (Piper em ambiente isolado + ffmpeg)
        id: voz
        continue-on-error: true
        run: |
          if ! /tmp/piper/bin/python -c "import piper" 2>/dev/null; then
            rm -rf /tmp/piper
            python3 -m venv /tmp/piper
            /tmp/piper/bin/pip install --quiet piper-tts
          fi
          # ffmpeg estatico do GitHub (BtbN/FFmpeg-Builds), guardado em cache; o apt chegou a levar 35 min (33,9 kB/s)
          if ! command -v ffmpeg >/dev/null; then
            if [ ! -x /tmp/ffmpeg-estatico/ffmpeg ]; then
              mkdir -p /tmp/ffmpeg-estatico
              curl -sSL --retry 4 --max-time 300 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
                | tar -xJ --strip-components=2 -C /tmp/ffmpeg-estatico --wildcards '*/bin/ffmpeg' || rm -rf /tmp/ffmpeg-estatico
            fi
            if [ -x /tmp/ffmpeg-estatico/ffmpeg ]; then
              echo /tmp/ffmpeg-estatico >> "$GITHUB_PATH"
            else
              sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
            fi
          fi

      - name: Cache dos modelos de voz
        uses: actions/cache@v4
        with:
          path: vozes
          key: vozes-v1-${{ hashFiles('fontes/*.json') }}
          restore-keys: vozes-v1-

      - name: Cache do audio por noticia
        uses: actions/cache@v4
        with:
          path: audio-cache
          key: audio-v1-${{ github.run_id }}
          restore-keys: audio-v1-

      - name: Gerar boletins em audio
        if: steps.voz.outcome == 'success'
        continue-on-error: true
        env:
          PIPER_PY: /tmp/piper/bin/python
          VOZES_DIR: ${{ github.workspace }}/vozes
          AUDIO_CACHE: ${{ github.workspace }}/audio-cache
        run: |
          ls fontes/*.json | xargs -n1 basename | sed 's/[.]json$//' | xargs -P 3 -I{} sh -c 'python3 -u coletor/boletim.py {} || echo "::warning::Boletim de {} falhou"'

      - name: Salvar historico no ramo dados
        run: |
          cd dados
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada novo para salvar"
          else
            git commit -q -m "coleta: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:refs/heads/dados
          fi

      - name: Montar site
        run: |
          mkdir -p _site/app _site/dados
          cp -r app/. _site/app/
          cp -r dados/* _site/dados/
          rm -f _site/dados/*/todos.json
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>GIN</title><meta http-equiv="refresh" content="0; url=app/"><a href="app/">Abrir o GIN</a>' > _site/index.html
          find _site -type f | sort
          du -sh _site

      - name: Medir o tamanho do site
        run: |
          du -sh _site | sed 's/^/  total do site: /'
          find _site -type f | wc -l | sed 's/^/  arquivos: /'
          find _site -name '*.ogg' -printf '%s\n' | awk '{s+=$1; n++} END {printf "  audio: %d arquivos, %.1f MB\n", n, s/1048576}'
          find _site -name '*.json' -printf '%s\n' | awk '{s+=$1; n++} END {printf "  json: %d arquivos, %.1f MB\n", n, s/1048576}'

      - name: Enviar site para o Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deploy
        continue-on-error: true  # a acao tem teto fixo de 10 min; se o Pages demorar, tenta de novo abaixo
        uses: actions/deploy-pages@v4

      - name: Aguardar o Pages antes da segunda tentativa
        if: always() && steps.deploy.outcome != 'success'
        run: sleep 90

      - name: Publicar no GitHub Pages (segunda tentativa)
        id: deploy2
        if: always() && steps.deploy.outcome != 'success'
        uses: actions/deploy-pages@v4
