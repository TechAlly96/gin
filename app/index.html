<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; worker-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<title>GIN · Notícias oficiais</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="stylesheet" href="estilo.css">
<script src="app.js" defer></script>
<script src="globo.js" defer></script>
</head>
<body>
<header class="topo">
  <div class="marca"><strong>GIN</strong><span>fontes oficiais</span>
    <button type="button" id="btn-pais" class="seletor" aria-haspopup="dialog">Carregando... ▾</button></div>
  <nav id="categorias" class="chips" aria-label="Categorias"></nav>
</header>
<dialog id="dlg-paises" class="dlg-paises" aria-label="Escolher país">
  <div class="dlg-topo">
    <input id="busca-pais" type="search" placeholder="Buscar país..." autocomplete="off" aria-label="Buscar país">
    <button type="button" id="fechar-paises" aria-label="Fechar">✕</button>
  </div>
  <nav id="paises" class="lista-paises" aria-label="Países"></nav>
</dialog>
<main>
  <div id="globo" class="globo" aria-label="Globo dos países cobertos"></div>
  <div class="ouvir">
    <button type="button" id="btn-ouvir" disabled>▶ Ouvir boletim</button>
    <button type="button" id="btn-tudo" class="secundario">Ouvir tudo</button>
    <span id="info-boletim"></span>
  </div>
  <details id="painel" class="painel">
    <summary id="resumo-status">Carregando...</summary>
    <ul id="lista-fontes"></ul>
  </details>
  <section id="feed" aria-live="polite"></section>
  <div id="sentinela" class="sentinela">Carregando...</div>
</main>
<div id="player" class="player" hidden>
  <div class="player-info"><span id="player-pais"></span><strong id="player-titulo">-</strong></div>
  <div class="player-barra" id="player-barra"><div id="player-progresso"></div></div>
  <div class="player-botoes">
    <button type="button" id="p-anterior" aria-label="Notícia anterior">⏮</button>
    <button type="button" id="p-tocar" aria-label="Tocar ou pausar">⏸</button>
    <button type="button" id="p-proxima" aria-label="Próxima notícia">⏭</button>
    <button type="button" id="p-velocidade" aria-label="Velocidade">1×</button>
    <button type="button" id="p-fechar" aria-label="Fechar o player">✕</button>
  </div>
</div>
<audio id="audio" preload="none"></audio>
</body>
</html>
